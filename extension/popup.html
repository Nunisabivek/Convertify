<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertify</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header class="header">
    <div class="brand-row">
      <img class="logo" src="icons/icon48.png" width="32" height="32" alt="">
      <div class="brand-text">
        <span class="brand">Convertify</span>
        <span class="tagline">Free PDF, image &amp; data tools</span>
      </div>
    </div>

    <div class="search">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input type="search" id="search" placeholder="Search tools" autocomplete="off" spellcheck="false"
        role="combobox" aria-label="Search tools" aria-controls="results" aria-expanded="true"
        aria-autocomplete="list" aria-describedby="searchHint">
      <kbd class="shortcut" id="shortcut" aria-hidden="true">Ctrl K</kbd>
    </div>
    <p class="visually-hidden" id="searchHint">Use the up and down arrow keys to pick a tool, then press Enter to open it.</p>
  </header>

  <section class="recent" id="recent" hidden>
    <h2 class="row-title" id="recentTitle">Recent</h2>
    <div class="chips" id="recentList"></div>
  </section>

  <main class="scroller">
    <div id="results" role="listbox" aria-label="Tools"></div>
  </main>
  <p class="visually-hidden" id="status" role="status" aria-live="polite"></p>

  <aside class="rate-card" id="rateCard" aria-labelledby="rateTitle" hidden>
    <div class="rate-head">
      <h2 class="rate-title" id="rateTitle">Convertify is on Android too</h2>
      <button type="button" class="btn-text" id="rateLater">Not now</button>
    </div>
    <p class="rate-text">Get the free Android app on Google Play, and leave a rating if it helps you.</p>
    <div class="rate-actions">
      <button type="button" class="btn btn-primary" id="ratePlay">Get it on Google Play</button>
      <button type="button" class="btn btn-secondary" id="rateExtension">Rate this extension</button>
    </div>
  </aside>

  <footer class="footer">
    <a class="footer-link" href="https://convertify.work/?utm_source=chrome_extension&amp;utm_medium=popup" target="_blank" rel="noopener">convertify.work</a>
    <span aria-hidden="true">&middot;</span>
    <a class="footer-link" href="https://convertify.work/all-tools?utm_source=chrome_extension&amp;utm_medium=popup" target="_blank" rel="noopener">All tools</a>
    <span class="footer-note">Files stay in your browser</span>
  </footer>

  <script src="tools.js"></script>
  <script src="popup.js"></script>
</body>

</html>
