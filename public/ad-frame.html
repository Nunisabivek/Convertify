<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Advertisement</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:transparent}</style>
</head>
<body>
<script>
// One Adsterra banner, served from ads.convertify.work so the ad runs in a different origin from the
// page: it keeps its own cookies (needed to fill) but cannot read or change the convertify.work page,
// its history or its navigation. Loaded by AdFrame (src/components/ads/banner.tsx).
(function () {
  var q = new URLSearchParams(location.search);
  var key = q.get('k') || '';
  var w = parseInt(q.get('w'), 10), h = parseInt(q.get('h'), 10);
  var sizes = { '300x250': 1, '728x90': 1, '320x50': 1, '160x300': 1 };
  if (!/^[a-z0-9]{8,64}$/i.test(key) || !sizes[w + 'x' + h]) return;
  window.atOptions = { key: key, format: 'iframe', height: h, width: w, params: {} };
  // Parser-inserted (not appendChild): Adsterra's tag may use document.write, which async scripts can't.
  document.write('<script src="https://tonicgoverness.com/' + key + '/invoke.js"><\/script>');
  // Adsterra takes 5-9 s to place a creative. If nothing but scripts is here after 12 s, tell the
  // page so it can give the slot's space back.
  setTimeout(function () {
    if (!document.body.querySelector(':not(script):not(style):not(noscript):not(link)')) {
      parent.postMessage({ cvAd: 'empty' }, '*');
    }
  }, 12000);
})();
</script>
</body>
</html>
